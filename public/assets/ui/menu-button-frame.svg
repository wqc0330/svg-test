<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 138" width="435" height="138">
  <title>主菜单按钮外框</title>
  <desc>435×138 空按钮素材：顶部菱形徽记 + 三层锻铁包边 + 血锈内胆。文字与交互态由引用方叠加，四个主菜单按钮共用这一份。</desc>

  <defs>
    <linearGradient id="mbf-iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f5c5b" />
      <stop offset="0.1" stop-color="#3b2e31" />
      <stop offset="0.34" stop-color="#1d1618" />
      <stop offset="0.58" stop-color="#2a2023" />
      <stop offset="0.82" stop-color="#150f11" />
      <stop offset="1" stop-color="#3d2f32" />
    </linearGradient>

    <linearGradient id="mbf-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0aaa4" stop-opacity="0.85" />
      <stop offset="0.5" stop-color="#6c5854" stop-opacity="0.5" />
      <stop offset="1" stop-color="#2a1d1f" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="mbf-blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d1f1d" />
      <stop offset="0.18" stop-color="#9e2f28" />
      <stop offset="0.52" stop-color="#8b2621" />
      <stop offset="0.82" stop-color="#5a1815" />
      <stop offset="1" stop-color="#2e0c0b" />
    </linearGradient>

    <linearGradient id="mbf-face-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2705d" stop-opacity="0.5" />
      <stop offset="0.22" stop-color="#d2705d" stop-opacity="0.12" />
      <stop offset="1" stop-color="#d2705d" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="mbf-end" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1416" />
      <stop offset="0.5" stop-color="#5f4b48" />
      <stop offset="1" stop-color="#231a1c" />
    </linearGradient>
  </defs>

  <!-- 一、顶部徽记：菱形底托，底尖插进框体，不留缝 -->
  <g id="mbf-crest">
    <path d="M217.5 0 L245 16 L217.5 34 L190 16 Z" fill="url(#mbf-iron)"
          stroke="#0b0809" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M217.5 3 L241 16 L217.5 30 L194 16 Z" fill="none"
          stroke="url(#mbf-rim)" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M217.5 8 L235 16 L217.5 25 L200 16 Z" fill="#401413" stroke="#8f322c" stroke-width="1.2" />
    <path d="M217.5 12 L227 16 L217.5 21 L208 16 Z" fill="#c1503f" />
  </g>

  <!-- 二、框体：外缘一层铁，内缘一道亮棱 -->
  <path id="mbf-body"
        d="M40 26 H395 L429 48 V114 L395 136 H40 L6 114 V48 Z"
        fill="url(#mbf-iron)" stroke="#080607" stroke-width="3" stroke-linejoin="round" />
  <path d="M41 28.5 H394 L426.5 49 V113 L394 133.5 H41 L8.5 113 V49 Z"
        fill="none" stroke="url(#mbf-rim)" stroke-width="2" stroke-linejoin="round" />

  <!-- 三、内胆：血锈底 -->
  <path d="M38 44 H397 L416 60 V102 L397 118 H38 L18 60 V102 Z"
        fill="url(#mbf-blood)" stroke="#0a0607" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M38 44 H397 L416 60 V102 L397 118 H38 L18 60 V102 Z" fill="url(#mbf-face-hi)" />

  <!-- 内胆四周压边：只交代转折，不压成一条灰带 -->
  <path d="M38 44 H397 L416 60 V64 H20 V60 Z" fill="#1b0f0e" opacity="0.42" />
  <path d="M38 118 H397 L416 102 V99 H20 V102 Z" fill="#150b0a" opacity="0.38" />

  <!-- 四、做旧：锈蚀斑与裂痕，密度控制在画面四周 -->
  <g fill="#43120f" opacity="0.55">
    <path d="M60 52 q18 10 6 22 q-16 8 -22 -4 q-4 -14 16 -18 Z" />
    <path d="M342 106 q22 -8 26 6 q-6 16 -22 12 q-10 -8 -4 -18 Z" />
    <path d="M150 46 q14 6 10 16 q-12 6 -18 -2 q0 -12 8 -14 Z" />
  </g>
  <g stroke="#2c0d0b" stroke-width="1.3" fill="none" opacity="0.6">
    <path d="M96 46 L104 68 L88 84 L98 114" />
    <path d="M358 48 L348 70 L362 88 L352 112" />
    <path d="M232 112 L258 100 L268 110" />
  </g>
  <g stroke="#c96a56" stroke-width="1" fill="none" opacity="0.22">
    <path d="M100 47 L108 68 L92 84 L102 112" />
    <path d="M300 46 L310 60 L296 74" />
  </g>

  <!-- 五、端头包边：斜切铁片 + 铆钉 -->
  <g>
    <path d="M34 46 L42 53 V109 L34 116 L24 104 V58 Z" fill="url(#mbf-end)" opacity="0.75" />
    <path d="M401 46 L393 53 V109 L401 116 L411 104 V58 Z" fill="url(#mbf-end)" opacity="0.75" />
    <circle cx="44" cy="81" r="3.2" fill="#8a7570" stroke="#0b0809" stroke-width="1.3" />
    <circle cx="391" cy="81" r="3.2" fill="#8a7570" stroke="#0b0809" stroke-width="1.3" />
  </g>

  <!-- 六、最内一圈收边，让红面与铁面彻底分开 -->
  <path d="M40 47 H395 L411 61 V101 L395 115 H40 L24 101 V61 Z"
        fill="none" stroke="#120d0e" stroke-width="1.5" opacity="0.9" />
</svg>
