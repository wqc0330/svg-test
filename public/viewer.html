<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>跳转中…</title>
    <script>
      // viewer.html 已并入工作台单页（/?file=…），这里只做旧链接兼容跳转
      var file = new URLSearchParams(location.search).get('file');
      location.replace(file ? '/?file=' + encodeURIComponent(file) : '/');
    </script>
  </head>
  <body>
    <p>正在跳转到工作台…</p>
  </body>
</html>
