<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     data-category="keyart" data-tags="主视觉,KeyArt,定调图,沉没钟楼,1080p" data-version="0.1.0">
  <title>主视觉 · 沉没的钟楼</title>
  <desc>深渊回响 Key Art 定调图：峡谷底部的沉没钟楼裂开并射出青色回响光柱，确立全作的暗蓝基调与青色辉光语言。</desc>

  <style>
    svg text {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      fill: #e6ecff;
    }
    .kv-logo {
      font-size: 88px;
      font-weight: 700;
      letter-spacing: 12px;
    }
    .kv-logo-en {
      font-size: 19px;
      letter-spacing: 9px;
      fill: #9fb2d8;
    }
    .kv-tagline {
      font-size: 22px;
      letter-spacing: 4px;
      fill: #c6d4f2;
    }
    .kv-note {
      font-size: 14px;
      letter-spacing: 2px;
      fill: #8296b8;
    }
    .kv-version {
      font-size: 13px;
      letter-spacing: 1px;
      fill: #6d7c99;
    }
  </style>

  <defs>
    <linearGradient id="kv-scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a16" stop-opacity="0" />
      <stop offset="1" stop-color="#070a16" stop-opacity="0.82" />
    </linearGradient>
  </defs>

  <!-- 一、背景层 -->
  <g data-role="background" aria-label="背景层" data-layer="bg">
    <rect width="1920" height="1080" fill="#070a16" />
  </g>

  <!-- 二、主视觉：整幅概念图素材 -->
  <g data-role="keyart" aria-label="主视觉：沉没的钟楼" data-layer="keyart">
    <image href="../assets/raw/keyart/abyss-main-visual.png" x="0" y="0" width="1920" height="1080" />
  </g>

  <!-- 三、压暗层：为标题让出可读性 -->
  <g data-role="layer" aria-label="压暗渐变" data-layer="scrim">
    <rect x="0" y="760" width="1920" height="320" fill="url(#kv-scrim)" />
  </g>

  <!-- 四、标题层 -->
  <g data-role="layer" aria-label="标题层" data-layer="title">
    <text x="120" y="920" class="kv-logo">深渊回响</text>
    <text x="128" y="962" class="kv-logo-en">ECHOES OF THE ABYSS</text>
    <rect x="120" y="986" width="110" height="3" fill="#63d2ff" opacity="0.85" />
    <text x="120" y="1026" class="kv-tagline">第一章 · 沉没的钟楼</text>
  </g>

  <!-- 五、设计要点标注 -->
  <g data-role="label" aria-label="构图与色彩要点">
    <text x="1800" y="88" class="kv-note" text-anchor="end">构图要点：钟楼居中轴，光柱竖切画面</text>
    <text x="1800" y="116" class="kv-note" text-anchor="end">色彩锚点：青色辉光只用于光源与符文</text>
  </g>
  <text x="1800" y="1040" class="kv-version" text-anchor="end">v0.1.0 · 概念定调稿</text>
</svg>
