<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     data-category="keyart" data-tags="风格板,Moodboard,配色,关键词,定调" data-version="0.1.0">
  <title>风格板 · 深渊回响</title>
  <desc>定调风格板：场景 / 角色 / 道具三张概念参考 + 全作五色配色与关键词，后续所有设计稿以此对齐美术语言。</desc>

  <style>
    svg text {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      fill: #e6ecff;
    }
    .mb-title {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 6px;
    }
    .mb-subtitle {
      font-size: 15px;
      letter-spacing: 6px;
      fill: #7f8fae;
    }
    .mb-cap {
      font-size: 20px;
      letter-spacing: 3px;
      fill: #c6d4f2;
    }
    .mb-hex {
      font-size: 17px;
      letter-spacing: 2px;
      fill: #9fb2d8;
      font-family: Consolas, "Courier New", monospace;
    }
    .mb-keywords {
      font-size: 18px;
      letter-spacing: 3px;
      fill: #8296b8;
    }
    .mb-version {
      font-size: 13px;
      letter-spacing: 1px;
      fill: #6d7c99;
    }
  </style>

  <!-- 一、背景层 -->
  <g data-role="background" aria-label="背景层" data-layer="bg">
    <rect width="1920" height="1080" fill="#070a16" />
  </g>

  <!-- 二、风格板主体 -->
  <g data-role="moodboard" aria-label="深渊回响风格板" data-layer="moodboard">
    <text x="96" y="120" class="mb-title">风格板 · 深渊回响</text>
    <text x="98" y="156" class="mb-subtitle">ECHOES OF THE ABYSS · 概念定调参考</text>

    <!-- 参考块一：场景概念 -->
    <g data-role="frame" aria-label="场景参考：深渊裂隙">
      <rect x="96" y="200" width="512" height="512" fill="#131c3a" stroke="#2b3a5c" stroke-width="2" />
      <image href="../assets/keyart/mb-env-abyss-rift.png" x="100" y="204" width="504" height="504" />
    </g>
    <text x="96" y="752" class="mb-cap">场景 · 深渊裂隙</text>

    <!-- 参考块二：角色概念 -->
    <g data-role="frame" aria-label="角色参考：深渊潜行者">
      <rect x="704" y="200" width="512" height="512" fill="#131c3a" stroke="#2b3a5c" stroke-width="2" />
      <image href="../assets/keyart/mb-char-abyss-stalker.png" x="708" y="204" width="504" height="504" />
    </g>
    <text x="704" y="752" class="mb-cap">角色 · 深渊潜行者</text>

    <!-- 参考块三：道具概念 -->
    <g data-role="frame" aria-label="道具参考：回响之钟">
      <rect x="1312" y="200" width="512" height="512" fill="#131c3a" stroke="#2b3a5c" stroke-width="2" />
      <image href="../assets/keyart/mb-prop-echo-bell.png" x="1316" y="204" width="504" height="504" />
    </g>
    <text x="1312" y="752" class="mb-cap">道具 · 回响之钟</text>

    <!-- 配色：五色锚点，色值写进 data-value 供程序提取 -->
    <rect data-role="swatch" data-value="#070A16" x="96" y="812" width="320" height="88" rx="8" aria-label="深渊夜空" />
    <text x="96" y="938" class="mb-hex">#070A16 深渊夜空</text>

    <rect data-role="swatch" data-value="#131C3A" x="448" y="812" width="320" height="88" rx="8" aria-label="深谷蓝" />
    <text x="448" y="938" class="mb-hex">#131C3A 深谷蓝</text>

    <rect data-role="swatch" data-value="#3F6FB5" x="800" y="812" width="320" height="88" rx="8" aria-label="远山雾蓝" />
    <text x="800" y="938" class="mb-hex">#3F6FB5 远山雾蓝</text>

    <rect data-role="swatch" data-value="#63D2FF" x="1152" y="812" width="320" height="88" rx="8" aria-label="回响辉光" />
    <text x="1152" y="938" class="mb-hex">#63D2FF 回响辉光</text>

    <rect data-role="swatch" data-value="#E6ECFF" x="1504" y="812" width="320" height="88" rx="8" aria-label="月白高光" />
    <text x="1504" y="938" class="mb-hex">#E6ECFF 月白高光</text>

    <!-- 关键词 -->
    <text x="96" y="1010" class="mb-keywords">关键词：深渊 · 回响 · 沉没 · 湿冷石质 · 青色辉光</text>
  </g>

  <text x="1800" y="1040" class="mb-version" text-anchor="end">v0.1.0 · 概念定调稿</text>
</svg>
