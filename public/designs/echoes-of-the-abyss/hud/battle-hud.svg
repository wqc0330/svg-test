<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-category="hud" data-tags="战斗HUD,常驻层,1080p" data-version="0.1.0">
  <title>战斗 HUD</title>
  <desc>战斗中的常驻信息层：左上角玩家血量与蓝量、顶部关卡目标与 Boss 血条、右上小地图、底部技能栏与 buff 计时、右下战斗播报。</desc>

  <style>
    svg text {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      fill: #e6ecff;
    }
    .hud-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .hud-sub {
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #93a4c4;
    }
    .hud-chapter {
      font-size: 15px;
      letter-spacing: 4px;
      fill: #93a4c4;
    }
    .hud-objective {
      font-size: 20px;
      letter-spacing: 2px;
    }
    .hud-boss-text {
      font-size: 16px;
      letter-spacing: 3px;
    }
    .hud-key {
      font-size: 14px;
      font-weight: 600;
      fill: #cfe0ff;
    }
    .hud-feed {
      font-size: 13px;
      letter-spacing: 0.5px;
      fill: #b9c6de;
    }
  </style>

  <defs>
    <linearGradient id="hud-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141d33" stop-opacity="0.92" />
      <stop offset="1" stop-color="#0b1120" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="hud-hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b5e" />
      <stop offset="1" stop-color="#c9382f" />
    </linearGradient>
    <linearGradient id="hud-boss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0417a" />
      <stop offset="1" stop-color="#7a2350" />
    </linearGradient>
  </defs>

  <!-- 一、场景占位：真实项目里替换为战斗画面 -->
  <g data-role="background" aria-label="场景占位">
    <rect width="1920" height="1080" fill="#0a0f1c" />
    <rect x="0" y="0" width="1920" height="1080" fill="#0d1526" opacity="0.6" />
    <text x="960" y="530" class="hud-sub" text-anchor="middle" opacity="0.5">场景占位 · 替换为战斗画面</text>
    <g data-role="decoration" aria-label="准心" stroke="#e6ecff" stroke-width="1.5" opacity="0.45">
      <line x1="944" y1="540" x2="976" y2="540" />
      <line x1="960" y1="524" x2="960" y2="556" />
      <circle cx="960" cy="540" r="9" fill="none" />
    </g>
  </g>

  <!-- 二、左上：玩家状态 -->
  <g data-role="hud" aria-label="玩家状态">
    <circle cx="86" cy="86" r="34" fill="#16203a" stroke="#3f6fb5" stroke-width="2" />
    <text x="86" y="93" class="hud-name" text-anchor="middle">旅人</text>
    <text x="136" y="70" class="hud-name">流浪的钟匠 Lv.24</text>

    <g data-role="bar" data-value="0.72" data-max="1" aria-label="生命值 72%">
      <rect x="136" y="82" width="320" height="14" rx="7" fill="#1a2237" />
      <rect x="136" y="82" width="230.4" height="14" rx="7" fill="url(#hud-hp)" />
      <text x="296" y="93" class="hud-sub" text-anchor="middle">1284 / 1780</text>
    </g>

    <g data-role="bar" data-value="0.45" data-max="1" aria-label="法力值 45%">
      <rect x="136" y="104" width="320" height="10" rx="5" fill="#1a2237" />
      <rect x="136" y="104" width="144" height="10" rx="5" fill="#4a8ef0" />
    </g>

    <g data-role="label" aria-label="增益状态" fill="#63d2ff">
      <rect x="136" y="128" width="26" height="26" rx="6" fill="#0f1a2e" stroke="#2b3a5c" />
      <rect x="170" y="128" width="26" height="26" rx="6" fill="#0f1a2e" stroke="#2b3a5c" />
      <rect x="204" y="128" width="26" height="26" rx="6" fill="#0f1a2e" stroke="#2b3a5c" />
      <text x="243" y="147" class="hud-sub">锋利 · 12s</text>
    </g>
  </g>

  <!-- 三、顶部：章节目标 + Boss 血条 -->
  <g data-role="hud" aria-label="关卡进度">
    <text x="960" y="52" class="hud-chapter" text-anchor="middle">第 1 章 · 沉没的钟楼</text>
    <text x="960" y="82" class="hud-objective" text-anchor="middle">击败钟楼守卫</text>

    <text x="600" y="112" class="hud-boss-text">钟楼守卫</text>
    <text x="1320" y="112" class="hud-sub" text-anchor="end">38%</text>
    <g data-role="bar" data-value="0.38" data-max="1" aria-label="Boss 生命值 38%">
      <rect x="600" y="122" width="720" height="16" rx="8" fill="#1a1526" stroke="#3b2a44" />
      <rect x="600" y="122" width="273.6" height="16" rx="8" fill="url(#hud-boss)" />
    </g>
  </g>

  <!-- 四、右上：小地图 -->
  <g data-role="minimap" aria-label="小地图">
    <rect x="1632" y="40" width="224" height="164" rx="12" fill="url(#hud-panel)" stroke="#2c3d63" />
    <rect x="1644" y="52" width="200" height="132" rx="8" fill="#0e1728" />
    <g stroke="#22304f" stroke-width="1">
      <line x1="1644" y1="118" x2="1844" y2="118" />
      <line x1="1744" y1="52" x2="1744" y2="184" />
    </g>
    <circle cx="1706" cy="140" r="4" fill="#3ddc97" />
    <circle cx="1706" cy="140" r="9" fill="none" stroke="#3ddc97" stroke-opacity="0.4" />
    <circle cx="1798" cy="86" r="3" fill="#e0574f" />
    <circle cx="1782" cy="96" r="3" fill="#e0574f" />
    <text x="1758" y="72" class="hud-sub" text-anchor="middle">N</text>
    <text x="1836" y="196" class="hud-sub" text-anchor="end">钟楼 2F</text>
  </g>

  <!-- 五、底部：技能栏 -->
  <g data-role="hud" aria-label="技能栏">
    <g data-role="slot" data-slot="1" data-action="skill-q" data-state="ready" role="button" tabindex="0" aria-label="技能 Q 回响斩">
      <rect x="750" y="968" width="76" height="76" rx="10" fill="#141d33" stroke="#31456e" />
      <text x="788" y="1016" class="hud-key" text-anchor="middle">Q</text>
      <text x="788" y="1036" class="hud-sub" text-anchor="middle">回响斩</text>
    </g>

    <g data-role="slot" data-slot="2" data-action="skill-w" data-state="cooling" data-cooldown="3.2" role="button" tabindex="0" aria-label="技能 W 钟摆（冷却 3.2 秒）">
      <rect x="836" y="968" width="76" height="76" rx="10" fill="#141d33" stroke="#31456e" />
      <text x="874" y="1016" class="hud-key" text-anchor="middle">W</text>
      <text x="874" y="1036" class="hud-sub" text-anchor="middle">钟摆</text>
      <rect x="836" y="968" width="76" height="76" rx="10" fill="#05070d" opacity="0.62" />
      <text x="874" y="1016" class="hud-name" text-anchor="middle">3.2</text>
    </g>

    <g data-role="slot" data-slot="3" data-action="skill-e" data-state="ready" role="button" tabindex="0" aria-label="技能 E 共鸣">
      <rect x="922" y="968" width="76" height="76" rx="10" fill="#141d33" stroke="#31456e" />
      <text x="960" y="1016" class="hud-key" text-anchor="middle">E</text>
      <text x="960" y="1036" class="hud-sub" text-anchor="middle">共鸣</text>
    </g>

    <g data-role="slot" data-slot="4" data-action="skill-r" data-state="charged" data-charges="2" role="button" tabindex="0" aria-label="技能 R 深渊回响（2 层充能）">
      <rect x="1008" y="968" width="76" height="76" rx="10" fill="#161f36" stroke="#63d2ff" stroke-width="1.5" />
      <text x="1046" y="1016" class="hud-key" text-anchor="middle">R</text>
      <text x="1046" y="1036" class="hud-sub" text-anchor="middle">回响 ×2</text>
    </g>

    <text x="1120" y="1010" class="hud-sub">充能 2 / 3</text>
    <rect x="1120" y="1020" width="120" height="6" rx="3" fill="#1a2237" />
    <rect x="1120" y="1020" width="80" height="6" rx="3" fill="#63d2ff" />
  </g>

  <!-- 六、右下：战斗播报 -->
  <g data-role="hud" aria-label="战斗播报">
    <text x="1872" y="912" class="hud-feed" text-anchor="end">拾取 · 钟摆齿轮 ×2</text>
    <text x="1872" y="938" class="hud-feed" text-anchor="end">暴击 · 钟楼守卫 受到 1,204 伤害</text>
    <text x="1872" y="964" class="hud-feed" text-anchor="end" opacity="0.6">暴击 · 钟楼守卫 受到 986 伤害</text>
  </g>

  <!-- 七、左下：队伍列表 -->
  <g data-role="hud" aria-label="队伍列表">
    <g data-role="label" aria-label="队友 苔原弓手">
      <rect x="48" y="880" width="220" height="52" rx="8" fill="url(#hud-panel)" stroke="#22304f" />
      <circle cx="74" cy="906" r="15" fill="#1c2740" />
      <text x="100" y="901" class="hud-sub">苔原弓手 Lv.23</text>
      <rect x="100" y="909" width="148" height="8" rx="4" fill="#1a2237" />
      <rect x="100" y="909" width="118" height="8" rx="4" fill="#3ddc97" />
    </g>

    <g data-role="label" aria-label="队友 沉默学者">
      <rect x="48" y="944" width="220" height="52" rx="8" fill="url(#hud-panel)" stroke="#22304f" />
      <circle cx="74" cy="970" r="15" fill="#1c2740" />
      <text x="100" y="965" class="hud-sub">沉默学者 Lv.24</text>
      <rect x="100" y="973" width="148" height="8" rx="4" fill="#1a2237" />
      <rect x="100" y="973" width="52" height="8" rx="4" fill="#e0574f" />
    </g>
  </g>
</svg>
