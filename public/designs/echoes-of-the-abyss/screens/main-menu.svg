<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" data-category="screens" data-tags="主菜单,落地页,1080p" data-version="0.1.0" data-scene-id="SC-001">
  <title>主菜单</title>
  <desc>登录后的落地界面：左下纵向菜单（继续游戏默认选中），右侧赛季预告面板，背景为深渊峡谷剪影与星空。</desc>

  <style>
    svg text {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      fill: #e6ecff;
    }
    .mm-logo {
      font-size: 92px;
      font-weight: 700;
      letter-spacing: 12px;
    }
    .mm-logo-en {
      font-size: 20px;
      letter-spacing: 9px;
      fill: #7f8fae;
    }
    .mm-menu {
      font-size: 26px;
      letter-spacing: 3px;
    }
    .mm-menu-hint {
      font-size: 15px;
      letter-spacing: 1px;
      fill: #8296b8;
    }
    .mm-panel-kicker {
      font-size: 14px;
      letter-spacing: 4px;
      fill: #63d2ff;
    }
    .mm-panel-title {
      font-size: 34px;
      font-weight: 600;
      letter-spacing: 4px;
    }
    .mm-panel-body {
      font-size: 15px;
      letter-spacing: 1px;
      fill: #93a4c4;
    }
    .mm-fine {
      font-size: 13px;
      letter-spacing: 1px;
      fill: #6d7c99;
    }
  </style>

  <defs>
    <linearGradient id="mm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f20" />
      <stop offset="0.55" stop-color="#131c3a" />
      <stop offset="1" stop-color="#070a16" />
    </linearGradient>
    <radialGradient id="mm-glow" cx="0.28" cy="0.34" r="0.55">
      <stop offset="0" stop-color="#3f6fb5" stop-opacity="0.34" />
      <stop offset="1" stop-color="#3f6fb5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mm-selected" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d3f6e" />
      <stop offset="1" stop-color="#152948" />
    </linearGradient>
    <linearGradient id="mm-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- 一、背景层 -->
  <g data-role="background" aria-label="背景层" data-layer="bg">
    <rect width="1920" height="1080" fill="url(#mm-sky)" />
    <rect width="1920" height="1080" fill="url(#mm-glow)" />

    <g data-role="decoration" aria-label="星空" fill="#a8bcf0">
      <circle cx="214" cy="146" r="2.4" opacity="0.55" />
      <circle cx="468" cy="92" r="1.6" opacity="0.4" />
      <circle cx="742" cy="188" r="2" opacity="0.6" />
      <circle cx="1024" cy="118" r="1.4" opacity="0.35" />
      <circle cx="1258" cy="212" r="2.6" opacity="0.5" />
      <circle cx="1520" cy="132" r="1.8" opacity="0.45" />
      <circle cx="1742" cy="236" r="2.2" opacity="0.35" />
      <circle cx="906" cy="72" r="1.2" opacity="0.3" />
    </g>

    <!-- 峡谷剪影：两层压深，制造纵深 -->
    <path d="M0 792 L286 604 L470 742 L700 566 L938 786 L1204 620 L1450 764 L1690 640 L1920 748 L1920 1080 L0 1080 Z" fill="#0c1324" />
    <path d="M0 902 L232 812 L470 892 L706 796 L966 906 L1236 820 L1508 902 L1748 830 L1920 886 L1920 1080 L0 1080 Z" fill="#060a13" />
    <rect width="1920" height="1080" fill="url(#mm-vignette)" />
  </g>

  <!-- 二、品牌层 -->
  <g data-role="layer" aria-label="品牌层" data-layer="brand">
    <text x="150" y="392" class="mm-logo">深渊回响</text>
    <text x="158" y="440" class="mm-logo-en">ECHOES OF THE ABYSS</text>
    <rect x="150" y="470" width="120" height="3" fill="#63d2ff" opacity="0.85" />
    <text x="150" y="512" class="mm-menu-hint">第一章 · 沉没的钟楼 ｜ 存档于 2 小时前</text>
  </g>

  <!-- 三、菜单层：每个可点条目一个 data-role="button" -->
  <g data-role="layer" aria-label="菜单层" data-layer="menu">
    <g data-role="button" data-action="continue" data-state="selected" role="button" tabindex="0" aria-label="继续游戏">
      <rect x="150" y="576" width="368" height="80" rx="10" fill="url(#mm-selected)" stroke="#63d2ff" stroke-width="1.5" />
      <rect x="150" y="576" width="4" height="80" rx="2" fill="#63d2ff" />
      <text x="188" y="626" class="mm-menu">继续游戏</text>
      <text x="486" y="624" class="mm-menu-hint" text-anchor="end">第 1 章</text>
    </g>

    <g data-role="button" data-action="new-game" data-state="default" role="button" tabindex="0" aria-label="新的旅程">
      <rect x="150" y="672" width="368" height="80" rx="10" fill="#111a2e" stroke="#2b3a5c" stroke-width="1.5" />
      <text x="188" y="722" class="mm-menu">新的旅程</text>
    </g>

    <g data-role="button" data-action="settings" data-state="default" role="button" tabindex="0" aria-label="设置">
      <rect x="150" y="768" width="368" height="80" rx="10" fill="#111a2e" stroke="#2b3a5c" stroke-width="1.5" />
      <text x="188" y="818" class="mm-menu">设置</text>
    </g>

    <g data-role="button" data-action="quit" data-state="default" role="button" tabindex="0" aria-label="退出游戏">
      <rect x="150" y="864" width="368" height="80" rx="10" fill="#111a2e" stroke="#2b3a5c" stroke-width="1.5" />
      <text x="188" y="914" class="mm-menu" fill="#93a4c4">退出游戏</text>
    </g>
  </g>

  <!-- 四、赛季面板：外框引用素材，整块可点击 -->
  <g data-role="button" data-action="open-season" data-state="default" role="button" tabindex="0" aria-label="查看第 3 赛季详情">
    <image href="../assets/raw/ui/panel-frame.svg" x="1320" y="288" width="320" height="480" />
    <text x="1352" y="352" class="mm-panel-kicker">第 3 赛季</text>
    <text x="1352" y="404" class="mm-panel-title">深渊回响</text>
    <line x1="1352" y1="428" x2="1608" y2="428" stroke="#2c3d63" stroke-width="1" />
    <text x="1352" y="466" class="mm-panel-body">剩余 12 天 06 时</text>
    <text x="1352" y="496" class="mm-panel-body">通行证进度 34 / 60</text>
    <rect x="1352" y="512" width="256" height="8" rx="4" fill="#1a2438" />
    <rect x="1352" y="512" width="145" height="8" rx="4" fill="#63d2ff" />
    <text x="1352" y="576" class="mm-panel-body">新增「沉没钟楼」副本</text>
    <text x="1352" y="606" class="mm-panel-body">限时掉落：回响之刃</text>
  </g>

  <!-- 五、页脚 -->
  <g data-role="layer" aria-label="页脚" data-layer="footer">
    <text x="150" y="1028" class="mm-fine">v0.1.0 · 内部预览稿</text>
    <g data-role="label" aria-label="服务器状态">
      <circle cx="1668" cy="1022" r="5" fill="#3ddc97" />
      <text x="1684" y="1028" class="mm-fine">亚服 · 28ms</text>
    </g>
  </g>
</svg>
