<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152"
     data-category="screens" data-tags="对战,擂台,装备阵列,像素风,2048x1152" data-version="0.2.0">
  <title>擂台对战</title>
  <desc>余烬纪第七夜，废墟庭院中的守灰者对峙：上下两条灰烬血脉、各自 10×3 装备阵列，卡牌按 2 列 × 3 行占格。</desc>

  <style>
    /* 字体在本稿统一声明；数字用窄重的展示体，贴近像素风的描边字。 */
    svg text {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      fill: #ded2bc;
    }
    .ba-num {
      font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
      paint-order: stroke;
      stroke: #0a0f06;
      stroke-width: 4px;
      stroke-linejoin: round;
      fill: #f2f6e6;
    }
    .ba-name {
      font-size: 15px;
      letter-spacing: 1.5px;
      paint-order: stroke;
      stroke: #0b0d08;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .ba-max {
      font-size: 13px;
      letter-spacing: 1px;
      fill: #b9ae97;
      paint-order: stroke;
      stroke: #0b0d08;
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }
    .ba-cost {
      font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 25px;
      fill: #f6eee0;
      text-anchor: middle;
    }
  </style>

  <defs>
    <linearGradient id="ba-hp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6ec59" />
      <stop offset="0.42" stop-color="#5cbe2e" />
      <stop offset="1" stop-color="#2b7a17" />
    </linearGradient>
    <linearGradient id="ba-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="ba-vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#04060a" stop-opacity="0.62" />
    </radialGradient>
    <radialGradient id="ba-cast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 一、背景：废墟庭院原画 + 压角 -->
  <g data-role="background" aria-label="背景层">
    <image href="../assets/backgrounds/arena-dusk-courtyard.png" x="0" y="0" width="2048" height="1152"
           preserveAspectRatio="xMidYMid slice" data-role="frame" aria-label="暮色庭院原画" />
    <rect width="2048" height="1152" fill="url(#ba-vignette)" />
  </g>

  <!-- 二、角色层：左右两名守灰者，脚下一层接地阴影 -->
  <g data-role="layer" aria-label="角色层">
    <ellipse cx="794" cy="716" rx="132" ry="26" fill="url(#ba-cast)" />
    <ellipse cx="1268" cy="716" rx="128" ry="26" fill="url(#ba-cast)" />
    <g data-role="character" data-side="player" aria-label="无名守灰者（己方，紫缨）">
      <image href="../assets/characters/knight-ashfall.png" x="670" y="494" width="248" height="221"
             data-role="sprite" aria-label="守灰者立绘" />
    </g>
    <g data-role="character" data-side="opponent" aria-label="灰烬教长（对手，金缨）">
      <image href="../assets/characters/knight-embercrest.png" x="1147" y="485" width="243" height="230"
             data-role="sprite" aria-label="教长立绘" />
    </g>
  </g>

  <!-- 三、阵板层：上为对手、下为己方；阵板与卡框都是 assets/ui 下的独立素材 -->
  <g data-role="layer" aria-label="阵板层">
    <g data-role="panel" aria-label="对手装备阵列 10×3">
      <image href="../assets/ui/board-10x3.svg" x="636" y="150" width="776" height="240"
             data-role="frame" aria-label="阵板底板" />
    </g>

    <g data-role="item" data-action="inspect-item" data-state="default" data-slot="opponent-0" role="group"
       aria-label="阔刃斧 · 费用 6 · 耐久 78%">
      <image href="../assets/ui/card-frame.svg" x="708" y="178" width="120" height="184" />
      <image href="../assets/items/item-broadblade.png" x="716" y="216" width="104" height="118"
             data-role="sprite" aria-label="阔刃斧图" />
      <text x="730" y="209" class="ba-cost">6</text>
      <g data-role="bar" data-value="0.78" data-max="1" aria-label="耐久 78%">
        <rect x="721" y="341" width="75" height="6" rx="3" fill="#b3392f" />
      </g>
    </g>

    <g data-role="item" data-action="inspect-item" data-state="default" data-slot="opponent-2" role="group"
       aria-label="弯月刃 · 费用 3 · 耐久 55%">
      <image href="../assets/ui/card-frame.svg" x="836" y="178" width="120" height="184" />
      <image href="../assets/items/item-curved-knife.png" x="844" y="216" width="104" height="118"
             data-role="sprite" aria-label="弯月刃图" />
      <text x="858" y="209" class="ba-cost">3</text>
      <g data-role="bar" data-value="0.55" data-max="1" aria-label="耐久 55%">
        <rect x="849" y="341" width="53" height="6" rx="3" fill="#b3392f" />
      </g>
    </g>

    <g data-role="panel" aria-label="己方装备阵列 10×3">
      <image href="../assets/ui/board-10x3.svg" x="636" y="736" width="776" height="240"
             data-role="frame" aria-label="阵板底板" />
    </g>

    <g data-role="item" data-action="inspect-item" data-state="selected" data-slot="player-0" role="group"
       aria-label="锈蚀短刃 · 费用 6 · 耐久 62%">
      <image href="../assets/ui/card-frame.svg" x="708" y="764" width="120" height="184" />
      <image href="../assets/items/item-rust-dagger.png" x="716" y="802" width="104" height="118"
             data-role="sprite" aria-label="锈蚀短刃图" />
      <text x="730" y="795" class="ba-cost">6</text>
      <g data-role="bar" data-value="0.62" data-max="1" aria-label="耐久 62%">
        <rect x="721" y="927" width="60" height="6" rx="3" fill="#b3392f" />
      </g>
    </g>

    <g data-role="item" data-action="inspect-item" data-state="default" data-slot="player-2" role="group"
       aria-label="弯月刃 · 费用 3 · 耐久 55%">
      <image href="../assets/ui/card-frame.svg" x="836" y="764" width="120" height="184" />
      <image href="../assets/items/item-curved-knife.png" x="844" y="802" width="104" height="118"
             data-role="sprite" aria-label="弯月刃图" />
      <text x="858" y="795" class="ba-cost">3</text>
      <g data-role="bar" data-value="0.55" data-max="1" aria-label="耐久 55%">
        <rect x="849" y="927" width="53" height="6" rx="3" fill="#b3392f" />
      </g>
    </g>
  </g>

  <!-- 四、血条层：外框是素材，填充条与数字按 data-value / data-max 回填 -->
  <g data-role="hud" aria-label="灰烬血脉">
    <g data-role="bar" data-value="72" data-max="160" data-side="opponent" aria-label="灰烬教长 血脉 72/160">
      <g transform="translate(704 76)">
        <image href="../assets/ui/hpbar-frame.svg" width="640" height="60" />
        <!-- 72/160 = 45%，616×0.45 ≈ 277 -->
        <rect x="12" y="12" width="277" height="36" fill="url(#ba-hp)" />
        <rect x="12" y="12" width="277" height="14" fill="url(#ba-gloss)" />
        <text x="26" y="41" class="ba-name">灰烬教长</text>
        <text x="320" y="44" class="ba-num" text-anchor="middle">72</text>
        <text x="626" y="42" class="ba-max" text-anchor="end">/ 160</text>
      </g>
    </g>

    <g data-role="bar" data-value="160" data-max="160" data-side="player" aria-label="无名守灰者 血脉 160/160">
      <g transform="translate(704 1032)">
        <image href="../assets/ui/hpbar-frame.svg" width="640" height="60" />
        <!-- 满血：616 全宽 -->
        <rect x="12" y="12" width="616" height="36" fill="url(#ba-hp)" />
        <rect x="12" y="12" width="616" height="14" fill="url(#ba-gloss)" />
        <text x="26" y="41" class="ba-name">无名守灰者</text>
        <text x="320" y="44" class="ba-num" text-anchor="middle">160</text>
        <text x="626" y="42" class="ba-max" text-anchor="end">/ 160</text>
      </g>
    </g>
  </g>

  <!-- 五、快捷按钮：底板是素材，按钮语义挂在外层 -->
  <g data-role="hud" aria-label="快捷按钮">
    <g data-role="button" data-action="open-satchel" data-state="default" role="button" tabindex="0" aria-label="打开行囊">
      <image href="../assets/ui/button-mug.png" x="515" y="1062" width="110" height="76"
             data-role="frame" aria-label="行囊按钮底板" />
    </g>
    <g data-role="button" data-action="open-record" data-state="default" role="button" tabindex="0" aria-label="查看战录">
      <image href="../assets/ui/button-crest.png" x="1426" y="1061" width="111" height="77"
             data-role="frame" aria-label="战录按钮底板" />
    </g>
  </g>

  <!-- 六、遮罩层：压黑/过场用，默认不显示 -->
  <g data-role="overlay" aria-label="遮罩层" opacity="0" />
</svg>
