<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152"
     data-category="hud" data-tags="战斗HUD,常驻层,回合计时,血条,2048x1152" data-version="0.1.0">
  <title>擂台 HUD · 常驻层</title>
  <desc>对战中的常驻信息层：顶部回合与布阵倒计时、上下两条灰烬血脉、牌库与弃牌计数、右侧战报、底部操作提示与两个快捷入口。</desc>

  <style>
    svg text {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      fill: #ded2bc;
    }
    .hb-num {
      font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
      paint-order: stroke;
      stroke: #0a0f06;
      stroke-width: 4px;
      stroke-linejoin: round;
      fill: #f2f6e6;
    }
    .hb-name {
      font-size: 15px;
      letter-spacing: 1.5px;
      paint-order: stroke;
      stroke: #0b0d08;
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .hb-max {
      font-size: 13px;
      letter-spacing: 1px;
      fill: #b9ae97;
      paint-order: stroke;
      stroke: #0b0d08;
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }
    .hb-round {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #efe4cd;
    }
    .hb-phase {
      font-size: 15px;
      letter-spacing: 2px;
      fill: #c3a9cf;
    }
    .hb-timer {
      font-family: Impact, "Arial Black", "Microsoft YaHei", sans-serif;
      font-size: 18px;
      fill: #e6d6bb;
      text-anchor: middle;
    }
    .hb-count {
      font-size: 16px;
      letter-spacing: 1px;
      fill: #cfc2a8;
    }
    .hb-feed {
      font-size: 14px;
      letter-spacing: 0.5px;
      fill: #c2b49b;
    }
    .hb-hint {
      font-size: 14px;
      letter-spacing: 2px;
      fill: #a99c85;
    }
  </style>

  <defs>
    <linearGradient id="hb-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f22" />
      <stop offset="1" stop-color="#150e10" />
    </linearGradient>
    <linearGradient id="hb-hp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6ec59" />
      <stop offset="0.42" stop-color="#5cbe2e" />
      <stop offset="1" stop-color="#2b7a17" />
    </linearGradient>
    <linearGradient id="hb-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="hb-scrim" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.2" stop-color="#05070a" stop-opacity="0.55" />
      <stop offset="1" stop-color="#05070a" stop-opacity="0.86" />
    </radialGradient>
  </defs>

  <!-- 一、场景底：这张稿只交付覆盖层，场景压暗当背景 -->
  <g data-role="background" aria-label="场景底">
    <image href="../assets/raw/backgrounds/arena-dusk-courtyard.png" x="0" y="0" width="2048" height="1152"
           preserveAspectRatio="xMidYMid slice" data-role="frame" aria-label="暮色庭院原画" opacity="0.55" />
    <rect width="2048" height="1152" fill="url(#hb-scrim)" />
  </g>

  <!-- 二、回合牌：回合数 + 阶段 + 倒计时环 -->
  <g data-role="hud" aria-label="回合状态">
    <g data-role="panel" aria-label="回合牌">
      <path d="M782 6 H1266 L1284 24 V48 L1266 66 H782 L764 48 V24 Z"
            fill="url(#hb-plate)" stroke="#5a4244" stroke-width="2" />
      <path d="M782 10 H1264" stroke="#7a5a5d" stroke-width="1.2" opacity="0.45" />
      <text x="796" y="45" class="hb-round">第 3 回合</text>
      <path d="M968 20 V52" stroke="#4a3739" stroke-width="2" />
      <text x="992" y="44" class="hb-phase">布阵阶段</text>
    </g>

    <g data-role="gauge" data-value="12" data-max="20" aria-label="布阵倒计时 12/20 秒">
      <circle cx="1240" cy="36" r="18" fill="#0b0708" stroke="#3a2a2c" stroke-width="2" />
      <circle cx="1240" cy="36" r="13" fill="none" stroke="#241a2e" stroke-width="6" />
      <!-- 12/20 = 60%，周长 2πr≈82，取 49 -->
      <circle cx="1240" cy="36" r="13" fill="none" stroke="#7d4fb0" stroke-width="6"
              stroke-dasharray="49 33" transform="rotate(-90 1240 36)" stroke-linecap="round" />
      <text x="1240" y="42" class="hb-timer">12</text>
    </g>
  </g>

  <!-- 三、对手血脉 -->
  <g data-role="hud" aria-label="对手血脉">
    <g data-role="bar" data-value="72" data-max="160" data-side="opponent" aria-label="灰烬教长 血脉 72/160">
      <g transform="translate(704 76)">
        <image href="../assets/raw/ui/hpbar-frame.svg" width="640" height="60" />
        <rect x="12" y="12" width="277" height="36" fill="url(#hb-hp)" />
        <rect x="12" y="12" width="277" height="14" fill="url(#hb-gloss)" />
        <text x="26" y="41" class="hb-name">灰烬教长</text>
        <text x="320" y="44" class="hb-num" text-anchor="middle">72</text>
        <text x="626" y="42" class="hb-max" text-anchor="end">/ 160</text>
      </g>
    </g>
  </g>

  <!-- 四、己方血脉 -->
  <g data-role="hud" aria-label="己方血脉">
    <g data-role="bar" data-value="160" data-max="160" data-side="player" aria-label="无名守灰者 血脉 160/160">
      <g transform="translate(704 1032)">
        <image href="../assets/raw/ui/hpbar-frame.svg" width="640" height="60" />
        <rect x="12" y="12" width="616" height="36" fill="url(#hb-hp)" />
        <rect x="12" y="12" width="616" height="14" fill="url(#hb-gloss)" />
        <text x="26" y="41" class="hb-name">无名守灰者</text>
        <text x="320" y="44" class="hb-num" text-anchor="middle">160</text>
        <text x="626" y="42" class="hb-max" text-anchor="end">/ 160</text>
      </g>
    </g>

    <g data-role="label" aria-label="牌库与弃牌计数">
      <rect x="120" y="1024" width="150" height="34" rx="6" fill="#150e10" stroke="#4a3336" stroke-width="1.5" />
      <text x="138" y="1047" class="hb-count">牌库 18</text>
      <rect x="120" y="1066" width="150" height="34" rx="6" fill="#150e10" stroke="#4a3336" stroke-width="1.5" />
      <text x="138" y="1089" class="hb-count">弃牌 6</text>
    </g>
  </g>

  <!-- 五、战报：最近三条，越往下越旧 -->
  <g data-role="hud" aria-label="战报">
    <text x="1996" y="880" class="hb-feed" text-anchor="end">第 3 回合 · 灰烬教长 布阵完成（3 件）</text>
    <text x="1996" y="908" class="hb-feed" text-anchor="end">阔刃斧 命中 · 守灰者 受到 24 伤害</text>
    <text x="1996" y="936" class="hb-feed" text-anchor="end" opacity="0.55">弯月刃 磨损 · 耐久 55%</text>
  </g>

  <!-- 六、快捷入口 -->
  <g data-role="hud" aria-label="快捷入口">
    <g data-role="button" data-action="open-satchel" data-state="default" role="button" tabindex="0" aria-label="打开行囊">
      <image href="../assets/raw/ui/button-mug.png" x="515" y="1062" width="110" height="76"
             data-role="frame" aria-label="行囊按钮底板" />
    </g>
    <g data-role="button" data-action="open-record" data-state="default" role="button" tabindex="0" aria-label="查看战录">
      <image href="../assets/raw/ui/button-crest.png" x="1426" y="1061" width="111" height="77"
             data-role="frame" aria-label="战录按钮底板" />
    </g>
  </g>

  <!-- 七、操作提示 -->
  <g data-role="hud" aria-label="操作提示">
    <text x="1024" y="1126" class="hb-hint" text-anchor="middle">拖拽卡牌落格 · 每空一格累积 1 点余烬</text>
  </g>

  <g data-role="overlay" aria-label="遮罩层" opacity="0" />
</svg>
