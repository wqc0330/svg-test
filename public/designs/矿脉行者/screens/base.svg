<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"
     data-category="screens" data-tags="基地,主界面,矿场,1080x1920" data-version="0.1.0" data-scene-id="SC-001">
  <title>矿脉行者 · 基地主界面</title>
  <desc>明亮卡通手绘矿场基地，展示体力与仓库资源摘要，并提供开始下矿和进入仓库两项操作。</desc>
  <style>
    text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
    .base-outline { stroke: #26344A; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .base-thin { stroke: #26344A; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .base-detail { stroke: #26344A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .base-title { fill: #26344A; font-size: 44px; font-weight: 900; letter-spacing: 2px; }
    .base-heading { fill: #26344A; font-size: 30px; font-weight: 800; }
    .base-label { fill: #26344A; font-size: 24px; font-weight: 700; }
    .base-small { fill: #52647A; font-size: 20px; font-weight: 600; }
    .base-number { fill: #26344A; font-size: 30px; font-weight: 900; }
    .base-button-text { fill: #26344A; font-size: 34px; font-weight: 900; text-anchor: middle; }
    .base-white { fill: #FFFDF4; }
  </style>
